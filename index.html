<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DevCardCV</title>
  <meta name="description" content="Fichas técnicas de desarrolladores">

  <!-- CSS Base -->
  <link rel="stylesheet" href="assets/css/tailwind.min.css">
  <link rel="stylesheet" href="assets/css/daisyui.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/animate.min.css">

  <!-- Estilos globales -->
  <style>
    [x-cloak] { display: none !important; }
    html { overflow: auto !important; }

    /* Design tokens — ClickUp-inspired: Slate + Emerald accent + Violet secondary */
    :root {
      --canvas: #f8fafc;
      --canvas-subtle: #f1f5f9;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --surface-elevated: #ffffff;
      --surface-raised: #ffffff;
      --ink: #0f172a;
      --ink-secondary: #1e293b;
      --ink-muted: #64748b;
      --ink-faint: #94a3b8;
      --ink-code: #475569;
      --border: #e2e5e9;
      --border-hover: #c9cdd3;
      --border-light: #eef0f2;

      --accent: #15803d;
      --accent-hover: #166534;
      --accent-light: rgba(22,163,74,0.07);
      --accent-border: rgba(22,163,74,0.15);
      --accent-secondary: #7b68ee;
      --accent-secondary-light: rgba(123,104,238,0.08);
      --accent-secondary-border: rgba(123,104,238,0.15);

      --status-success: #22c55e;
      --status-warning: #f59e0b;
      --status-error: #ef4444;
      --status-info: #3b82f6;

      --shadow-border: 0 0 0 1px var(--border);
      --shadow-card: 0 1px 3px 0 rgba(0,0,0,0.08), 0 0 0 1px var(--border);
      --shadow-card-hover: 0 1px 3px 0 rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.06), 0 0 0 1px var(--border-hover);
      --shadow-elevated: 0 1px 3px 0 rgba(0,0,0,0.08), 0 6px 24px rgba(0,0,0,0.06), 0 0 0 1px var(--border-hover);
      --shadow-fab: 0 4px 14px rgba(21,128,61,0.3);

      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-pill: 9999px;

      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 🔧 Color overrides — Developer Tool palette */
    /* Primary = Slate ink */
    .text-primary { color: var(--ink) !important; }
    .text-primary\/5 { color: rgba(15,23,42,0.05) !important; }
    .text-primary\/10 { color: rgba(15,23,42,0.1) !important; }
    .text-primary\/20 { color: rgba(15,23,42,0.2) !important; }
    .text-primary\/30 { color: rgba(15,23,42,0.3) !important; }
    .text-primary\/40 { color: rgba(15,23,42,0.4) !important; }
    .text-primary\/50 { color: rgba(15,23,42,0.5) !important; }
    .text-primary\/60 { color: rgba(15,23,42,0.6) !important; }
    .text-primary\/70 { color: rgba(15,23,42,0.7) !important; }
    .text-primary\/80 { color: rgba(15,23,42,0.8) !important; }
    .bg-primary { background-color: var(--ink) !important; }
    .bg-primary\/5 { background-color: rgba(15,23,42,0.05) !important; }
    .bg-primary\/10 { background-color: rgba(15,23,42,0.1) !important; }
    .border-primary, .border-b-primary { border-color: var(--ink) !important; }

    /* Accent = Code Green */
    .text-accent { color: var(--accent) !important; }
    .text-accent\/5 { color: rgba(34,197,94,0.05) !important; }
    .text-accent\/10 { color: rgba(34,197,94,0.1) !important; }
    .text-accent\/20 { color: rgba(34,197,94,0.2) !important; }
    .text-accent\/30 { color: rgba(34,197,94,0.3) !important; }
    .text-accent\/40 { color: rgba(34,197,94,0.4) !important; }
    .text-accent\/50 { color: rgba(34,197,94,0.5) !important; }
    .text-accent\/60 { color: rgba(34,197,94,0.6) !important; }
    .text-accent\/70 { color: rgba(34,197,94,0.7) !important; }
    .text-accent\/80 { color: rgba(34,197,94,0.8) !important; }
    .bg-accent { background-color: var(--accent) !important; }
    .bg-accent\/5 { background-color: rgba(34,197,94,0.05) !important; }
    .bg-accent\/10 { background-color: rgba(34,197,94,0.1) !important; }
    .border-accent, .border-b-accent { border-color: var(--accent) !important; }

    /* Secondary = Violet (ClickUp-inspired) */
    .text-secondary { color: var(--accent-secondary) !important; }
    .text-secondary\/40 { color: rgba(123,104,238,0.4) !important; }
    .text-secondary\/60 { color: rgba(123,104,238,0.6) !important; }
    .bg-secondary { background-color: var(--accent-secondary) !important; }
    .bg-secondary\/5 { background-color: var(--accent-secondary-light) !important; }
    .bg-secondary\/10 { background-color: rgba(123,104,238,0.1) !important; }

    .btn-primary {
      background: var(--accent) !important;
      color: white !important;
      border: none !important;
      border-radius: var(--radius-sm) !important;
      transition: all var(--transition-spring) !important;
    }
    .btn-primary:hover {
      background: var(--accent-hover) !important;
      transform: scale(1.02);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary[disabled], .btn-primary.btn-disabled {
      background-color: var(--ink-faint) !important;
      border-color: var(--ink-faint) !important;
      color: #ffffff !important;
      opacity: 0.5;
    }

    /* checkbox — Linear-inspired */
    .checkbox-primary {
      --chkbg: var(--accent);
      --chkfg: #ffffff;
    }
    .checkbox-primary:checked {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
    }

    /* btn-ghost */
    .btn-ghost {
      background: transparent !important;
      border-radius: var(--radius-sm) !important;
      transition: all var(--transition-normal) !important;
    }
    .btn-ghost:hover {
      background: var(--surface-muted) !important;
    }

    /* badge-ghost = sutil */
    .badge-ghost {
      background-color: var(--surface-muted) !important;
      color: var(--ink-muted) !important;
      border-color: var(--border) !important;
    }
    .badge-accent {
      background-color: var(--accent-light) !important;
      color: var(--accent) !important;
      border-color: var(--accent-border) !important;
    }

    /* alert colors — increased opacity for WCAG AA bg contrast */
    .alert-info {
      background-color: rgba(0,111,255,0.12) !important;
      color: #0052cc !important;
      border-color: rgba(0,111,255,0.2) !important;
    }
    .alert-success {
      background-color: rgba(34,197,94,0.12) !important;
      color: #15803d !important;
      border-color: rgba(34,197,94,0.2) !important;
    }
    .alert-warning {
      background-color: rgba(245,158,11,0.12) !important;
      color: #a16207 !important;
      border-color: rgba(245,158,11,0.2) !important;
    }
    .alert-error {
      background-color: rgba(239,68,68,0.12) !important;
      color: #b91c1c !important;
      border-color: rgba(239,68,68,0.2) !important;
    }

    /* Canvas — subtle slate */
    body { background: var(--canvas) !important; color: var(--ink) !important; }

    /* Cards — shadow-as-border (Linear-inspired), minimal elevation */
    .card {
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: none;
      transition: box-shadow var(--transition-normal), transform var(--transition-normal);
      background: var(--surface) !important;
    }
    .card:hover {
      box-shadow: var(--shadow-elevated);
      transform: translateY(-1px);
    }
    .bg-white { background: var(--surface) !important; }

    /* Typography — tight tracking, weight hierarchy */
    h1, h2, h3, h4, h5, h6 {
      letter-spacing: -0.025em;
      font-weight: 600;
    }
    .tracking-display { letter-spacing: -0.04em; }
    .tracking-heading { letter-spacing: -0.025em; }
    .tracking-body { letter-spacing: 0; }

    /* Section labels — uppercase, muted, small */
    .section-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
       color: var(--ink-muted);
    }

    /* Botones — outlined secondary, filled primary only */
    .btn {
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { box-shadow: var(--shadow-border); }

    /* Inputs — Linear-inspired, border + subtle ring */
    .input, .select, .textarea {
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
      border-color: var(--border);
      color: var(--ink);
      background: var(--surface);
      font-size: 0.875rem;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }
    .input::placeholder, .select::placeholder, .textarea::placeholder {
      color: var(--ink-faint);
    }

    /* Badges por categoría — Developer Tool tinted backgrounds */
    .badge-skill-lenguajes { background: rgba(59,130,246,0.08); color: #1d4ed8; border: 1px solid rgba(59,130,246,0.15); }
    .badge-skill-frameworks { background: rgba(34,197,94,0.08); color: #15803d; border: 1px solid rgba(34,197,94,0.15); }
    .badge-skill-bases-de-datos { background: rgba(168,85,247,0.08); color: #7e22ce; border: 1px solid rgba(168,85,247,0.15); }
    .badge-skill-devops { background: rgba(245,158,11,0.08); color: #a16207; border: 1px solid rgba(245,158,11,0.15); }
    .badge-skill-cloud { background: rgba(14,165,233,0.08); color: #0369a1; border: 1px solid rgba(14,165,233,0.15); }
    .badge-skill-testing { background: rgba(239,68,68,0.08); color: #b91c1c; border: 1px solid rgba(239,68,68,0.15); }
    .badge-skill-general { background: rgba(100,116,139,0.06); color: #475569; border: 1px solid rgba(100,116,139,0.12); }
    .badge-skill-frontend { background: rgba(59,130,246,0.08); color: #1d4ed8; border: 1px solid rgba(59,130,246,0.15); }
    .badge-skill-backend { background: rgba(139,92,246,0.08); color: #7e22ce; border: 1px solid rgba(139,92,246,0.15); }
    .badge-skill-redes-seguridad { background: rgba(239,68,68,0.08); color: #b91c1c; border: 1px solid rgba(239,68,68,0.15); }
    .badge-skill-soft-skills { background: rgba(34,197,94,0.08); color: #15803d; border: 1px solid rgba(34,197,94,0.15); }
    .badge-skill-diseno-uxui-grafico, .badge-skill-diseño-uxui-gráfico { background: rgba(236,72,153,0.08); color: #be185d; border: 1px solid rgba(236,72,153,0.15); }
    .badge-skill-devops-cloud { background: rgba(245,158,11,0.08); color: #a16207; border: 1px solid rgba(245,158,11,0.15); }
    .badge-skill-analitica-de-datos, .badge-skill-analítica-de-datos { background: rgba(16,185,129,0.08); color: #047857; border: 1px solid rgba(16,185,129,0.15); }
    .badge-skill-cms { background: rgba(107,114,128,0.08); color: #4b5563; border: 1px solid rgba(107,114,128,0.15); }
    .badge-skill-herramientas { background: rgba(107,114,128,0.06); color: #525252; border: 1px solid rgba(107,114,128,0.12); }
    .badge-skill-metodologias { background: rgba(168,85,247,0.08); color: #7e22ce; border: 1px solid rgba(168,85,247,0.15); }

    /* Tabla — sin borders pesados, hover sutil */
    .table { border-radius: var(--radius-lg); overflow: hidden; }
    .table tr { transition: background var(--transition-fast); }
    .table tr:hover { background: var(--surface-muted); }
    .table th { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); padding-top: 0.75rem; padding-bottom: 0.75rem; }

    /* Sidebar nav activo — soft accent background + barra */
    .menu li > a.active {
      background: rgba(21,128,61,0.10);
      font-weight: 600;
      color: var(--accent);
      position: relative;
    }
    .menu li > a.active::before {
      content: '';
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 18px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .menu li > a:not(.active):hover {
      background: var(--surface-muted);
    }

    /* Modal — elevated surface */
    .modal-box {
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevated);
      background: var(--surface) !important;
      color: var(--ink);
    }
    .modal-backdrop, .modal-overlay {
      background: rgba(0,0,0,0.5) !important;
    }

    /* Modal — elevated surface (ya definido arriba) */

    /* Checkbox personalizado — Linear-inspired */
    .checkbox.checkbox-xs {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1.5px solid var(--ink-faint);
      background: transparent;
      transition: all var(--transition-fast);
    }
    .checkbox.checkbox-xs:checked {
      background: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
    }
    .checkbox.checkbox-xs:hover {
      border-color: var(--accent);
    }

    /* Progress bars — category distribution */
    .progress-bar-track {
      height: 6px;
      border-radius: 3px;
      background: var(--surface-muted);
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Toast — soft lift */
    .toast-container {
      position: fixed; top: 1rem; right: 1rem; z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Stat blocks — large numerals, muted descriptors */
    .stat-value {
      font-size: 1.875rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-muted);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Skip link */
    .skip-link {
      position: absolute; top: -100%; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: white; padding: 0.5rem 1rem;
      border-radius: var(--radius-sm); z-index: 10000; font-weight: 600;
    }
    .skip-link:focus { top: 0.5rem; }

    /* FAB — Floating Action Button, Linear-inspired */
    .fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9000;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--accent); color: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-fab), 0 0 0 1px rgba(0,0,0,0.05);
      transition: transform var(--transition-spring), box-shadow var(--transition-fast);
      border: none; cursor: pointer;
    }
    .fab:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(21,128,61,0.35), 0 0 0 1px rgba(0,0,0,0.08); }
    .fab:active { transform: scale(0.94); }
    .fab i { font-size: 1.25rem; }

    /* Focus ring — accent green, visible */
    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      border-radius: var(--radius-sm);
    }

    /* 🔍 Contraste WCAG AA — text-base-content/50 usa --ink-muted sólido en vez de opacidad */
    .text-base-content\/50 { color: var(--ink-muted) !important; }

    /* 🎬 Page transition */
    #app-content {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* 💀 Skeleton loading shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, var(--surface-muted) 25%, rgba(255,255,255,0.5) 50%, var(--surface-muted) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius-md);
    }

    /* 🎯 Stagger fade-in */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-enter {
      animation: fadeInUp 0.3s ease both;
    }

    /* 💚 Saved indicator */
    .saved-indicator {
      animation: fadeIn 0.2s ease, fadeOut 0.3s ease 1.5s forwards;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.8); } }

    /* 🎯 Sidebar colapsable — solo en desktop */
    .sidebar-aside { width: 15rem; }
    .sidebar-aside .menu li a {
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
      font-size: 0.875rem;
    }
    .sidebar-aside .menu li a:hover {
      background: var(--surface-muted);
    }
    @media (min-width: 1024px) {
      .sidebar-aside.sidebar-collapsed:not(.hover-expand) { width: 64px; }
    }
    @media (max-width: 1023px) {
      .sidebar-aside.sidebar-collapsed { width: 15rem; }
    }
    .sidebar-aside.sidebar-collapsed:not(.hover-expand) .menu li a {
      justify-content: center;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
    }
    .sidebar-aside.sidebar-collapsed:not(.hover-expand) .menu li a span { display: none; }
    .sidebar-aside.sidebar-collapsed:not(.hover-expand) .menu li a i { margin: 0; font-size: 1.25rem; }

    /* Drawer-side on desktop: match sidebar width for smooth grid */
    @media (min-width: 1024px) {
      .drawer.lg\:drawer-open > .drawer-side { width: auto; }
    }

    /* 🧰 Utility classes — consolidar inline styles repetidos */
    .border-default { border: 1px solid var(--border); }
    .border-b-default { border-bottom: 1px solid var(--border); }
    .border-t-default { border-top: 1px solid var(--border); }
    .border-r-default { border-right: 1px solid var(--border); }
    .text-muted { color: var(--ink-muted); }
    .text-faint { color: var(--ink-faint); }
    .bg-muted { background: var(--surface-muted); }
    .bg-elevated { background: var(--surface-elevated); }
    .bg-canvas { background: var(--canvas); }
    .radius-sm { border-radius: var(--radius-sm); }
    .radius-md { border-radius: var(--radius-md); }
    .radius-lg { border-radius: var(--radius-lg); }
    .shadow-card { box-shadow: var(--shadow-card); }
    .shadow-elevated { box-shadow: var(--shadow-elevated); }
    .shadow-border { box-shadow: var(--shadow-border); }
    .transition-spring { transition: all var(--transition-spring); }
    .transition-fast { transition: all var(--transition-fast); }
    .transition-normal { transition: all var(--transition-normal); }
    .tracking-display { letter-spacing: -0.04em; }
    .tracking-heading { letter-spacing: -0.025em; }
    .radius-pill { border-radius: var(--radius-pill); }

    /* Status indicators */
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; }
    .status-dot-success { background: var(--status-success); }
    .status-dot-error { background: var(--status-error); }
    .status-dot-warning { background: var(--status-warning); }
    .status-dot-info { background: var(--status-info); }

    /* Hover card lift */
    .card-hover { transition: box-shadow var(--transition-normal), transform var(--transition-normal); cursor: pointer; }
    .card-hover:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }

    /* Magnetic button */
    .btn-magnetic { transition: transform var(--transition-spring), box-shadow var(--transition-normal); }
    .btn-magnetic:hover { transform: scale(1.02); }
    .btn-magnetic:active { transform: scale(0.98); }

    /* ── Squeletor: Skeleton screens ── */
    .sk-el { background: linear-gradient(90deg, var(--surface-muted) 25%, rgba(255,255,255,0.4) 50%, var(--surface-muted) 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; border-radius: var(--radius-sm); }
    .sk-text { height: 0.75rem; margin-bottom: 0.5rem; width: 60%; }
    .sk-text-sm { height: 0.625rem; width: 40%; margin-bottom: 0.375rem; }
    .sk-heading { height: 1.25rem; width: 45%; margin-bottom: 0.75rem; }
    .sk-avatar { width: 2.5rem; height: 2.5rem; border-radius: 9999px; }
    .sk-badge { height: 1.25rem; width: 3.5rem; border-radius: 9999px; display: inline-block; }
    .sk-card { height: 6rem; border-radius: var(--radius-md); margin-bottom: 0.75rem; }
    .sk-row { height: 2.75rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem; }
    .sk-progress { height: 0.75rem; border-radius: 9999px; width: 70%; }
    .sk-chart { height: 12rem; border-radius: var(--radius-md); }

    /* Monospace for code-like data */
    .font-mono-data { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace; font-size: 0.75rem; letter-spacing: -0.02em; }

    /* Touch targets ≥44px on mobile */
    @media (pointer: coarse) {
      .btn-xs { min-height: 44px; min-width: 44px; }
      .btn-sm { min-height: 44px; }
      .btn-ghost.btn-xs { min-height: 44px; min-width: 44px; }
      .btn-square.btn-xs { min-height: 44px; min-width: 44px; }
    }
  </style>
</head>
<body>
  <!-- Skip link -->
  <a href="#app-content" class="skip-link">Saltar al contenido</a>

  <!-- Offline banner -->
  <div x-data="{ online: navigator.onLine }"
       x-init="window.addEventListener('online', () => online = true); window.addEventListener('offline', () => online = false)"
       x-show="!online"
       x-transition
       class="fixed top-0 inset-x-0 bg-amber-50 text-amber-800 text-center text-sm py-1.5 z-50 border-b-default">
    <i class="bi bi-wifi-off"></i> Sin conexión — los datos se guardan localmente
  </div>

  <!-- App Shell -->
  <div class="drawer lg:drawer-open" x-data @keydown.window.escape="$el.querySelector('#sidebar-drawer').checked = false">
    <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />

    <!-- Main content -->
    <div class="drawer-content flex flex-col min-h-screen">
      <!-- Mobile hamburger toggle -->
      <div class="lg:hidden fixed top-3 left-3 z-30" x-show="$store.auth.isLoggedIn">
<label for="sidebar-drawer" class="btn btn-square btn-ghost btn-sm bg-white shadow-card radius-md border-default" aria-label="Abrir menú" title="Abrir menú">
  <i class="bi bi-list text-xl"></i>
</label>
      </div>

      <!-- Page content -->
      <main id="app-content" class="flex-1"
            :class="$store.auth.isLoggedIn ? 'p-4 lg:p-8 pb-20 lg:pb-8' : ''"
            role="main"
            x-data="{ skType: 'dashboard' }"
            x-init="$watch('$store.loading.phase', v => {
              if (v.includes('Conectando')) skType = 'auth';
              else if (v.includes('Base de datos')) skType = 'auth';
              else skType = 'dashboard';
            })">
        <!-- Squeletor: loading skeleton -->
        <div id="app-loading" x-show="$store.loading.visible" x-cloak
             x-transition:leave="opacity-0 duration-300"
             class="w-full max-w-4xl mx-auto">

          <!-- Fase texto -->
          <div class="flex items-center gap-3 mb-6 text-sm text-muted">
            <span class="loading loading-spinner loading-xs text-accent"></span>
            <span x-text="$store.loading.phase"></span>
          </div>

          <!-- Skeleton tipo Dashboard -->
          <div x-show="skType === 'dashboard'">
            <div class="flex justify-between items-start mb-6">
              <div><div class="sk-el sk-heading"></div><div class="sk-el sk-text-sm"></div></div>
              <div class="sk-el sk-badge"></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div class="sk-el sk-card"></div>
              <div class="sk-el sk-card"></div>
              <div class="sk-el sk-card"></div>
              <div class="sk-el sk-card"></div>
            </div>
            <div class="sk-el sk-chart mb-6"></div>
            <div class="sk-el sk-row"></div>
            <div class="sk-el sk-row"></div>
            <div class="sk-el sk-row" style="width:80%"></div>
          </div>

          <!-- Skeleton tipo Auth -->
          <div x-show="skType === 'auth'" class="flex flex-col items-center justify-center min-h-[50vh] gap-4">
            <div class="sk-el" style="width:5rem;height:5rem;border-radius:9999px"></div>
            <div class="sk-el sk-heading" style="width:8rem"></div>
            <div class="sk-el sk-text" style="width:14rem"></div>
            <div class="sk-el sk-row" style="width:18rem;height:2.75rem"></div>
            <div class="sk-el sk-row" style="width:18rem;height:2.75rem"></div>
            <div class="sk-el sk-badge" style="width:6rem;height:2.25rem"></div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer x-show="$store.auth.isLoggedIn" class="text-center py-4 text-xs shrink-0 bg-white border-t-default text-muted">
        Copyright 2026 GDAIS &mdash; DevCardCV
      </footer>
    </div>

      <!-- Sidebar -->
      <div x-show="$store.auth.isLoggedIn" class="drawer-side z-50">
        <label for="sidebar-drawer" class="drawer-overlay"></label>
        <aside class="menu sidebar-aside bg-white text-base-content transition-all duration-200 overflow-y-auto flex flex-col border-r-default"
               :class="[
                 $store.ui.sidebarCollapsed ? 'sidebar-collapsed' : '',
                 hoverExpand ? 'hover-expand' : ''
               ]"
               @mouseenter="hoverExpand = true"
               @mouseleave="hoverExpand = false"
               x-data="{ hoverExpand: false }"
               style="min-height: 100dvh;">

          <!-- Collapse toggle + Logo row -->
          <div class="flex items-center justify-between px-3 py-4 shrink-0 border-b-default" style="height: 57px;">
            <div x-show="!$store.ui.sidebarCollapsed || hoverExpand" class="flex items-center gap-2" x-cloak>
              <i class="bi bi-code-square text-accent text-lg"></i>
              <span class="text-sm font-semibold tracking-heading">DevCardCV</span>
            </div>
            <div x-show="$store.ui.sidebarCollapsed && !hoverExpand" class="mx-auto" x-cloak>
              <i class="bi bi-code-square text-accent text-lg"></i>
            </div>
<button class="btn btn-ghost btn-xs btn-square shrink-0 hidden lg:inline-flex" @click="$store.ui.toggleSidebar()" title="Alternar sidebar" aria-label="Alternar sidebar">
  <i :class="$store.ui.sidebarCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'" class="text-sm"></i>
</button>
          </div>

          <!-- User profile -->
          <div x-show="$store.auth.isLoggedIn"
               class="mx-2 my-3 p-2 rounded-lg shrink-0 bg-muted"
               :class="$store.ui.sidebarCollapsed && !hoverExpand ? 'p-1.5' : ''">
            <div class="flex items-center gap-3" :class="$store.ui.sidebarCollapsed && !hoverExpand ? 'flex-col' : ''">
              <div class="avatar cursor-pointer shrink-0"
                   @click="window.location.hash='#/cv/' + ($store.auth.perfil?.id || $store.auth.user?.perfilId || '')"
                   title="Ver mi perfil">
                <div class="w-9 h-9 rounded-full ring-2 ring-accent/20 overflow-hidden">
                  <img x-show="$store.auth.fotoBase64" :src="$store.auth.fotoBase64" alt="Foto de perfil" class="w-full h-full object-cover" />
                  <div x-show="!$store.auth.fotoBase64" class="w-full h-full flex items-center justify-center bg-base-200 rounded-full">
                    <span class="text-xs font-semibold text-base-content/40" x-text="($store.auth.perfil?.nombre || $store.auth.user?.nombre || '?').charAt(0)"></span>
                  </div>
                </div>
              </div>
              <div x-show="!$store.ui.sidebarCollapsed || hoverExpand" class="flex-1 min-w-0" x-cloak>
                <p class="text-sm font-medium truncate" x-text="$store.auth.perfil?.nombre || $store.auth.user?.nombre"></p>
                <div class="flex items-center gap-1 mt-0.5">
                  <span class="badge badge-xs" :class="$store.auth.user?.rol === 'admin' ? 'badge-accent' : 'badge-ghost'"
                        x-text="$store.auth.user?.rol === 'admin' ? 'Admin' : ($store.auth.perfil?.cargo || 'Dev')"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Navigation menu -->
          <nav id="nav-menu" aria-label="Navegación principal" class="menu menu-md gap-0.5 px-2 mt-2 flex-1">
            <!-- Generado dinámicamente por app.js -- aria-current="page" debe aplicarse al <a> activo -->
          </nav>

          <!-- Bottom: Logout -->
          <div class="mt-auto px-2 py-3 border-t border-base-200 shrink-0">
            <button x-show="$store.auth.isLoggedIn"
                     class="btn btn-ghost btn-sm w-full justify-start gap-2 radius-md"
                     :class="$store.ui.sidebarCollapsed && !hoverExpand ? 'btn-square mx-auto' : ''"
                     @click="window.dispatchEvent(new CustomEvent('auth-logout'))"
                     title="Cerrar sesión">
              <i class="bi bi-box-arrow-right text-sm"></i>
              <span x-show="!$store.ui.sidebarCollapsed || hoverExpand" x-cloak class="text-xs">Cerrar sesión</span>
            </button>
            <p x-show="!$store.ui.sidebarCollapsed || hoverExpand" class="text-xs text-center mt-2 text-muted" x-cloak>v1.0.0</p>
          </div>
        </aside>
      </div>
  </div>

  <!-- FAB — Agregar desarrollador rápido -->
  <button x-show="$store.auth.isLoggedIn" class="fab btn-magnetic" id="fab-add-dev" aria-label="Agregar desarrollador" title="Agregar desarrollador" onclick="window.location.hash='#/perfiles/nuevo/'+Date.now()">
    <i class="bi bi-person-plus-fill"></i>
  </button>

  <!-- Sync status flotante -->
  <div class="fixed bottom-4 left-4 z-40" x-show="$store.auth.isLoggedIn">
    <span class="badge gap-1.5 text-xs font-medium shadow-card border-default transition-normal"
          :class="$store.supabase.status === 'connected' ? 'badge-ghost' : $store.network.online ? 'badge-warning' : 'badge-error'"
          :title="$store.supabase.status === 'connected' ? 'Sincronizado con Supabase' : $store.supabase.status === 'disabled' ? 'Supabase no configurado' : $store.network.online ? 'Supabase desconectado' : 'Sin conexión'"
          style="border-radius: 20px;">
      <i :class="$store.supabase.status === 'connected' ? 'bi-cloud-check-fill text-accent' : $store.network.online ? 'bi-cloud-slash-fill' : 'bi-wifi-off'" class="text-[10px]"></i>
      <span x-text="$store.supabase.status === 'connected' ? 'Sync' : $store.network.online ? 'Local' : 'Offline'"></span>
    </span>
  </div>

  <!-- JS Librerías base -->
  <script src="assets/js/libs/alpine.js"></script>
  <script>if(typeof Alpine!=='undefined'&&!Alpine.store('loading'))Alpine.store('loading',{phase:'Cargando...',visible:true});</script>
  <script>
    // 🚨 alpine.js no auto-arranca (eliminamos queueMicrotask del bundle).
    // Creamos stores AHORA (NO dentro de alpine:init, porque ese evento aún no ha ocurrido).
    if (typeof Alpine !== 'undefined') {
      if (!Alpine.store('auth')) {
        Alpine.store('auth', {
          user: null, sessionToken: null, perfil: null, fotoBase64: null,
          get isLoggedIn() { return !!this.user; },
          get isAdmin() { return this.user && this.user.rol === 'admin'; },
          setSession(session) { this.user = session; this.sessionToken = session && session.token; },
          setPerfil(p) { this.perfil = p; this.fotoBase64 = (p && p.fotoBase64) || null; },
          clearSession() {
            this.user = null; this.sessionToken = null; this.perfil = null; this.fotoBase64 = null;
            try { localStorage.removeItem('_auth_session'); } catch(e) {}
          },
          canEdit(pid) { return this.user ? this.user.rol === 'admin' || this.user.perfilId === pid : false; },
          canManageSkills() { return !!this.user; },
          canBackup() { return this.user && this.user.rol === 'admin'; }
        });
      }
      if (!Alpine.store('ui')) {
        Alpine.store('ui', {
          sidebarCollapsed: (() => { try { return localStorage.getItem('_sidebar_collapsed') === 'true'; } catch(e) { return false; } })(),
          toggleSidebar() {
            this.sidebarCollapsed = !this.sidebarCollapsed;
            try { localStorage.setItem('_sidebar_collapsed', this.sidebarCollapsed); } catch(e) {}
          }
        });
      }
    }
  </script>
  <script src="assets/js/libs/alpinejs-collapse.min.js"></script>
  <script>Alpine.start();</script>
  <script src="assets/js/libs/dexie.js"></script>
  <script src="assets/js/libs/crypto-js.js"></script>
  <script src="assets/js/libs/pako.js"></script>
<script src="assets/js/libs/supabase.js"></script>
  <script src="assets/js/libs/apexcharts.js"></script>
  <script src="assets/js/libs/jspdf.js"></script>
  <script src="assets/js/libs/xlsx.js"></script>

  <!-- 📚 JS Librerías adicionales -->
  <script src="assets/js/libs/html2canvas.min.js"></script>
<script src="assets/js/libs/dayjs.min.js"></script>
<script src="assets/js/libs/emailjs.min.js"></script>
<script src="assets/js/libs/sql-wasm.data.js"></script>
<script src="assets/js/libs/sql-wasm.js"></script>

  <!-- Configuración -->
  <script src="project.config.js"></script>

  <!-- Core -->
<script src="core/db.js"></script>
<script src="core/db-sqlite.js"></script>
<script src="core/db-supabase.js"></script>
<script src="core/crypto.js"></script>
  <script src="core/ui.js"></script>
  <script src="core/app.js"></script>

  <!-- Módulos -->
  <script src="modules/auth/module.js"></script>
  <script src="modules/dashboard/module.js"></script>
  <script src="modules/perfiles/module.js"></script>
  <script src="modules/habilidades/module.js"></script>
  <script src="modules/cv/module.js"></script>
  <script src="modules/proyectos/module.js"></script>

  <!-- Main -->
  <script src="main.js"></script>
</body>
</html>
