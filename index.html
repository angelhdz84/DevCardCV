<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DevCardCV</title>
  <meta name="description" content="Fichas técnicas de desarrolladores">

  <!-- CSS Base -->
  <link rel="stylesheet" href="assets/css/tailwind.min.css">
  <link rel="stylesheet" href="assets/css/daisyui.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/animate.min.css">

  <!-- Estilos globales -->
  <style>
    [x-cloak] { display: none !important; }
    html { overflow: auto !important; }

    /* Design tokens — Developer Tool: Slate + Code Green */
    :root {
      /* Surface palette — slate canvas with code-green energy */
      --canvas: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --surface-elevated: #ffffff;
      --ink: #020617;
      --ink-secondary: #1e293b;
      --ink-muted: #475569;
      --ink-faint: #94a3b8;
      --border: rgba(15,23,42,0.08);
      --border-hover: rgba(15,23,42,0.12);

      /* Accent — Code Green (WCAG AA compliant) + Blue for tech */
      --accent: #15803d;
      --accent-hover: #166534;
      --accent-light: rgba(34,197,94,0.08);
      --accent-border: rgba(34,197,94,0.15);
      --accent-secondary: #3b82f6;
      --accent-secondary-light: rgba(59,130,246,0.08);

      /* Shadows — shadow-as-border + feather lift */
      --shadow-border: 0 0 0 1px var(--border);
      --shadow-card: 0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-elevated: 0 0 0 1px var(--border-hover), 0 4px 16px rgba(0,0,0,0.06);
      --shadow-soft: 0 0 4px -2px rgba(0,0,0,0.08);
      --shadow-fab: 0 4px 14px rgba(21,128,61,0.25);

      /* Radius */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;

      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 🔧 Color overrides — Developer Tool palette */
    /* Primary = Slate ink */
    .text-primary { color: var(--ink) !important; }
    .text-primary\/5 { color: rgba(15,23,42,0.05) !important; }
    .text-primary\/10 { color: rgba(15,23,42,0.1) !important; }
    .text-primary\/20 { color: rgba(15,23,42,0.2) !important; }
    .text-primary\/30 { color: rgba(15,23,42,0.3) !important; }
    .text-primary\/40 { color: rgba(15,23,42,0.4) !important; }
    .text-primary\/50 { color: rgba(15,23,42,0.5) !important; }
    .text-primary\/60 { color: rgba(15,23,42,0.6) !important; }
    .text-primary\/70 { color: rgba(15,23,42,0.7) !important; }
    .text-primary\/80 { color: rgba(15,23,42,0.8) !important; }
    .bg-primary { background-color: var(--ink) !important; }
    .bg-primary\/5 { background-color: rgba(15,23,42,0.05) !important; }
    .bg-primary\/10 { background-color: rgba(15,23,42,0.1) !important; }
    .border-primary, .border-b-primary { border-color: var(--ink) !important; }

    /* Accent = Code Green */
    .text-accent { color: var(--accent) !important; }
    .text-accent\/5 { color: rgba(34,197,94,0.05) !important; }
    .text-accent\/10 { color: rgba(34,197,94,0.1) !important; }
    .text-accent\/20 { color: rgba(34,197,94,0.2) !important; }
    .text-accent\/30 { color: rgba(34,197,94,0.3) !important; }
    .text-accent\/40 { color: rgba(34,197,94,0.4) !important; }
    .text-accent\/50 { color: rgba(34,197,94,0.5) !important; }
    .text-accent\/60 { color: rgba(34,197,94,0.6) !important; }
    .text-accent\/70 { color: rgba(34,197,94,0.7) !important; }
    .text-accent\/80 { color: rgba(34,197,94,0.8) !important; }
    .bg-accent { background-color: var(--accent) !important; }
    .bg-accent\/5 { background-color: rgba(34,197,94,0.05) !important; }
    .bg-accent\/10 { background-color: rgba(34,197,94,0.1) !important; }
    .border-accent, .border-b-accent { border-color: var(--accent) !important; }

    /* Secondary = Blue */
    .text-secondary { color: var(--accent-secondary) !important; }
    .text-secondary\/40 { color: rgba(59,130,246,0.4) !important; }
    .text-secondary\/60 { color: rgba(59,130,246,0.6) !important; }
    .bg-secondary { background-color: var(--accent-secondary) !important; }
    .bg-secondary\/5 { background-color: rgba(59,130,246,0.05) !important; }
    .bg-secondary\/10 { background-color: rgba(59,130,246,0.1) !important; }

    /* btn-primary = Code Green con texto blanco */
    .btn-primary {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #ffffff !important;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover) !important;
      border-color: var(--accent-hover) !important;
    }
    .btn-primary:active {
      background-color: var(--accent-hover) !important;
      border-color: var(--accent-hover) !important;
    }
    .btn-primary[disabled], .btn-primary.btn-disabled {
      background-color: var(--ink-faint) !important;
      border-color: var(--ink-faint) !important;
      color: #ffffff !important;
    }

    /* checkbox-primary = Code Green */
    .checkbox-primary {
      --chkbg: var(--accent);
      --chkfg: #ffffff;
    }
    .checkbox-primary:checked {
      background-color: #ff4d00 !important;
      border-color: #ff4d00 !important;
    }

    /* badge-ghost = sutil */
    .badge-ghost {
      background-color: rgba(0,0,0,0.04) !important;
      color: #525252 !important;
      border-color: rgba(0,0,0,0.08) !important;
    }

    /* alert colors */
    .alert-info {
      background-color: rgba(0,111,255,0.08) !important;
      color: #0052cc !important;
      border-color: rgba(0,111,255,0.15) !important;
    }
    .alert-success {
      background-color: rgba(34,197,94,0.08) !important;
      color: #15803d !important;
      border-color: rgba(34,197,94,0.15) !important;
    }
    .alert-warning {
      background-color: rgba(245,158,11,0.08) !important;
      color: #a16207 !important;
      border-color: rgba(245,158,11,0.15) !important;
    }
    .alert-error {
      background-color: rgba(239,68,68,0.08) !important;
      color: #b91c1c !important;
      border-color: rgba(239,68,68,0.15) !important;
    }

    /* Canvas background — paper-like warmth */
    body { background: var(--canvas) !important; color: var(--ink) !important; }

    /* Cards — shadow-as-border, no dramatic elevation */
    .card {
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: none;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
      background: var(--surface) !important;
    }
    .card:hover { box-shadow: var(--shadow-elevated); }
    .bg-white { background: var(--surface) !important; }

    /* Typography — tight tracking, weight hierarchy */
    h1, h2, h3, h4, h5, h6 {
      letter-spacing: -0.025em;
      font-weight: 600;
    }
    .tracking-display { letter-spacing: -0.04em; }
    .tracking-heading { letter-spacing: -0.025em; }
    .tracking-body { letter-spacing: 0; }

    /* Section labels — uppercase, muted, small */
    .section-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
       color: var(--ink-muted);
    }

    /* Botones — outlined secondary, filled primary only */
    .btn {
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { box-shadow: var(--shadow-border); }

    /* Inputs */
    .input, .select, .textarea {
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      border-color: var(--border);
      color: var(--ink);
    }
    .input:focus, .select:focus, .textarea:focus {
      box-shadow: 0 0 0 2px rgba(255,77,0,0.15);
      border-color: var(--accent);
    }

    /* Badges por categoría — Developer Tool tinted backgrounds */
    .badge-skill-lenguajes { background: rgba(59,130,246,0.08); color: #1d4ed8; border: 1px solid rgba(59,130,246,0.15); }
    .badge-skill-frameworks { background: rgba(34,197,94,0.08); color: #15803d; border: 1px solid rgba(34,197,94,0.15); }
    .badge-skill-bases-de-datos { background: rgba(168,85,247,0.08); color: #7e22ce; border: 1px solid rgba(168,85,247,0.15); }
    .badge-skill-devops { background: rgba(245,158,11,0.08); color: #a16207; border: 1px solid rgba(245,158,11,0.15); }
    .badge-skill-cloud { background: rgba(14,165,233,0.08); color: #0369a1; border: 1px solid rgba(14,165,233,0.15); }
    .badge-skill-testing { background: rgba(239,68,68,0.08); color: #b91c1c; border: 1px solid rgba(239,68,68,0.15); }
    .badge-skill-general { background: rgba(100,116,139,0.06); color: #475569; border: 1px solid rgba(100,116,139,0.12); }

    /* Tabla — subtle hover, no heavy borders */
    .table tr { transition: background var(--transition-fast); }
    .table tr:hover { background: var(--surface-muted); }
    .table { border-radius: var(--radius-lg); overflow: hidden; }

    /* Sidebar nav activo — accent tint */
    .menu li > a.active {
      background: var(--accent-light);
      font-weight: 600;
      color: var(--accent);
    }

    /* Modal — elevated surface */
    .modal-box {
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevated);
      background: var(--surface) !important;
      color: var(--ink);
    }
    .modal-backdrop, .modal-overlay {
      background: rgba(0,0,0,0.5) !important;
    }

    /* Toast — soft lift */
    .toast-container {
      position: fixed; top: 1rem; right: 1rem; z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Stat blocks — large numerals, muted descriptors */
    .stat-value {
      font-size: 1.875rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-muted);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Modal — elevated surface (ya definido arriba) */

    /* Checkbox personalizado — Linear-inspired */
    .checkbox.checkbox-xs {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1.5px solid var(--ink-faint);
      background: transparent;
      transition: all var(--transition-fast);
    }
    .checkbox.checkbox-xs:checked {
      background: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
    }
    .checkbox.checkbox-xs:hover {
      border-color: var(--accent);
    }

    /* Progress bars — category distribution */
    .progress-bar-track {
      height: 6px;
      border-radius: 3px;
      background: var(--surface-muted);
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Toast — soft lift */
    .toast-container {
      position: fixed; top: 1rem; right: 1rem; z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Stat blocks — large numerals, muted descriptors */
    .stat-value {
      font-size: 1.875rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-muted);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Skip link */
    .skip-link {
      position: absolute; top: -100%; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: white; padding: 0.5rem 1rem;
      border-radius: var(--radius-sm); z-index: 10000; font-weight: 600;
    }
    .skip-link:focus { top: 0.5rem; }

    /* FAB — Floating Action Button */
    .fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9000;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-fab);
      transition: all var(--transition-fast);
      border: none; cursor: pointer;
    }
    .fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(74,222,128,0.3); }
    .fab:active { transform: scale(0.95); }
    .fab i { font-size: 1.5rem; }

    /* Focus ring visibility */
    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* 🔍 Contraste WCAG AA — text-base-content/50 usa --ink-muted sólido en vez de opacidad */
    .text-base-content\/50 { color: var(--ink-muted) !important; }

    /* 🎬 Page transition */
    #app-content {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* 💀 Skeleton loading shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, var(--surface-muted) 25%, rgba(255,255,255,0.5) 50%, var(--surface-muted) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius-md);
    }

    /* 🎯 Stagger fade-in */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-enter {
      animation: fadeInUp 0.3s ease both;
    }

    /* 💚 Saved indicator */
    .saved-indicator {
      animation: fadeIn 0.2s ease, fadeOut 0.3s ease 1.5s forwards;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.8); } }
  </style>
</head>
<body>
  <!-- Skip link -->
  <a href="#app-content" class="skip-link">Saltar al contenido</a>

  <!-- Offline banner -->
  <div x-data="{ online: navigator.onLine }"
       x-init="window.addEventListener('online', () => online = true); window.addEventListener('offline', () => online = false)"
       x-show="!online"
       x-transition
       class="fixed top-0 inset-x-0 bg-amber-50 text-amber-800 text-center text-sm py-1.5 z-50"
       style="border-bottom: 1px solid rgba(0,0,0,0.06);">
    <i class="bi bi-wifi-off"></i> Sin conexión — los datos se guardan localmente
  </div>

  <!-- App Shell -->
  <div class="drawer lg:drawer-open">
    <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />

    <!-- Main content -->
    <div class="drawer-content flex flex-col min-h-screen">
      <!-- Topbar -->
      <header class="navbar bg-white sticky top-0 z-40 px-4 lg:px-6 shrink-0" style="border-bottom: 1px solid var(--border);">
        <div class="flex-none lg:hidden">
          <label for="sidebar-drawer" class="btn btn-square btn-ghost">
            <i class="bi bi-list text-xl"></i>
          </label>
        </div>
        <div class="flex-1">
          <h1 class="text-lg font-semibold tracking-heading flex items-center gap-2">
            <i class="bi bi-code-square text-accent text-xl"></i>
            <span>DevCardCV</span>
          </h1>
        </div>
        <div class="flex-none flex items-center gap-2">
          <div class="flex items-center gap-2" x-show="$store.auth.isLoggedIn">
            <span class="text-sm text-base-content/50 hidden sm:inline">Hola,</span>
            <span class="text-sm font-medium hidden sm:inline truncate max-w-[120px]" x-text="$store.auth.user?.nombre"></span>
            <div class="avatar">
              <div class="w-7 h-7 rounded-full ring-2 ring-accent/20">
                <img x-show="$store.auth.fotoBase64" :src="$store.auth.fotoBase64" alt="" class="w-full h-full object-cover" />
                <div x-show="!$store.auth.fotoBase64" class="w-full h-full flex items-center justify-center bg-base-200 rounded-full">
                  <i class="bi bi-person-fill text-xs text-base-content/40"></i>
                </div>
              </div>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm btn-square" onclick="window.dispatchEvent(new CustomEvent('auth-logout'))" title="Cerrar sesión" x-show="$store.auth.isLoggedIn">
            <i class="bi bi-box-arrow-right text-lg"></i>
          </button>
          <span class="badge gap-1.5 text-xs font-medium"
                :class="$store.supabase.status === 'connected' ? 'badge-ghost' : $store.network.online ? 'badge-warning' : 'badge-error'"
                style="transition: all var(--transition-normal);"
                :title="$store.supabase.status === 'connected' ? 'Sincronizado con Supabase' : $store.supabase.status === 'disabled' ? 'Supabase no configurado' : $store.network.online ? 'Supabase desconectado' : 'Sin conexión'">
            <i :class="$store.supabase.status === 'connected' ? 'bi-cloud-check-fill text-accent' : $store.network.online ? 'bi-cloud-slash-fill' : 'bi-wifi-off'" class="text-[10px]"></i>
            <span x-text="$store.supabase.status === 'connected' ? 'Sync' : $store.network.online ? 'Local' : 'Offline'"></span>
          </span>
        </div>
      </header>

      <!-- Page content -->
      <main id="app-content" class="flex-1 p-4 lg:p-8" role="main">
        <!-- Cargado dinámicamente por el router -->
      </main>

      <!-- Footer -->
      <footer class="text-center py-3 text-xs shrink-0 bg-white" style="border-top: 1px solid var(--border); color: var(--ink-muted);">
        Copyright 2026 GDAIS &mdash; DevCardCV
        <span class="mx-2 opacity-30">|</span>
        <kbd class="px-1 py-0.5 rounded" style="background: var(--surface-muted); font-family: inherit; font-size: 0.625rem;">Ctrl+N</kbd> Nuevo
        <kbd class="px-1 py-0.5 rounded ml-1" style="background: var(--surface-muted); font-family: inherit; font-size: 0.625rem;">Ctrl+F</kbd> Buscar
      </footer>
    </div>

      <!-- Sidebar -->
      <div class="drawer-side z-50">
        <label for="sidebar-drawer" class="drawer-overlay"></label>
        <aside class="menu p-4 w-64 bg-white text-base-content" style="min-height: 100vh; border-right: 1px solid var(--border);">
          <div class="mb-6 mt-2 px-1">
            <h2 class="text-sm font-semibold tracking-heading flex items-center gap-2">
              <i class="bi bi-code-square text-accent"></i> DevCardCV
            </h2>
            <p class="text-xs" style="color: var(--ink-muted);">Fichas técnicas de desarrollo</p>
          </div>
          <ul id="nav-menu" class="menu menu-md gap-0.5">
            <!-- Generado dinámicamente por app.js -->
          </ul>
          <div class="mt-auto pt-4 border-t border-base-200 px-1">
            <div x-show="$store.auth.isLoggedIn" class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium truncate max-w-[140px]" x-text="$store.auth.user?.nombre"></span>
              <button class="btn btn-ghost btn-xs gap-1" onclick="window.dispatchEvent(new CustomEvent('auth-logout'))" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right text-xs"></i>
              </button>
            </div>
            <p class="text-xs" style="color: var(--ink-muted);">v1.0.0 &mdash; Offline-first</p>
          </div>
        </aside>
      </div>
  </div>

  <!-- FAB — Agregar desarrollador rápido -->
  <button class="fab" id="fab-add-dev" title="Agregar desarrollador" onclick="window.location.hash='#/perfiles'; setTimeout(() => { const evt = new CustomEvent('fab-open-form'); window.dispatchEvent(evt); }, 300);">
    <i class="bi bi-person-plus-fill"></i>
  </button>

  <!-- JS Librerías base -->
  <script src="assets/js/libs/alpine.js"></script>
  <script>
    // 💡 Auth store temprano: Alpine necesita $store.auth antes de evaluar templates
    if (!Alpine.store('auth')) {
      Alpine.store('auth', {
        user: null,
        sessionToken: null,
        fotoBase64: null,
        get isLoggedIn() { return !!this.user; },
        get isAdmin() { return this.user && this.user.rol === 'admin'; },
        setSession(session) {
          this.user = session;
          this.sessionToken = session && session.token;
          this.fotoBase64 = null;
        },
        clearSession() {
          this.user = null;
          this.sessionToken = null;
          this.fotoBase64 = null;
          var k = typeof APP_CONFIG !== 'undefined' && APP_CONFIG.auth ? APP_CONFIG.auth.sessionKey : '_auth_session';
          try { localStorage.removeItem(k); } catch(e) {}
        },
        canEdit(perfilId) {
          if (!this.user) return false;
          if (this.user.rol === 'admin') return true;
          return this.user.perfilId === perfilId;
        },
        canManageSkills() { return this.user && this.user.rol === 'admin'; },
        canBackup() { return this.user && this.user.rol === 'admin'; }
      });
