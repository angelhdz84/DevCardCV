name: "APK Android (DevCardCV)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (requerido por gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias Capacitor
        run: |
          npm install --no-audit --no-fund

      - name: Copiar frontend a www/
        run: node copiar-web.cjs

      - name: Generar proyecto Android (cap add + sync)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generar iconos de la app (assets/icon-512.png → mipmap)
        run: node generar-iconos.cjs

      - name: Compilar APK release
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firmar APK con keystore del repo (firma estable entre builds)
        working-directory: capacitor/android
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks ../keystore/devcardcv-release.p12 \
            --ks-pass pass:devcardcv2026 \
            --key-pass pass:devcardcv2026 \
            --ks-key-alias devcardcv \
            --out DevCardCV.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs DevCardCV.apk

      - name: Subir APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: DevCardCV-APK
          path: capacitor/android/DevCardCV.apk
          if-no-files-found: error
